name: Mise à jour de la veille

on:
  schedule:
    - cron: "30 7 * * *"        # chaque matin (8 h 30 à Paris en hiver), après les mises à jour AN (2 h-8 h 30) et Sénat (3 h-5 h) : collecte complète
    - cron: "0 13 * * *"        # chaque après-midi (14 h à Paris en hiver) : 2e collecte complète (amendements déposés dans la journée)
    - cron: "5 6-20 * * 1-5"    # toutes les heures en semaine (7 h - 21 h à Paris) : agenda, ordre du jour, flux RSS
  workflow_dispatch:
    inputs:
      mode:
        description: "full = toutes les sources, light = agenda, ordre du jour et RSS"
        type: choice
        options: [full, light]
        default: full

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restaurer les données déjà téléchargées
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Collecter et construire
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || ((github.event.schedule == '30 7 * * *' || github.event.schedule == '0 13 * * *') && 'full' || 'light') }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          LETTRE_FROM: ${{ secrets.LETTRE_FROM }}
          LETTRE_DEST: ${{ secrets.LETTRE_DEST }}
        run: bash scripts/update.sh "$MODE"
      - name: Sauvegarder les données
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}
      - name: Garder la planification active (GitHub la coupe après 60 jours sans commit)
        if: github.event.schedule == '30 7 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
